# ==========================================================================
# H1 — HRDecoder-W48，外部真实病灶预训练 → DDR 适配（锁定意图配置 / locked intent）
# 与 H0 唯一差异：external_pretrain_checkpoint 与 pretrain_stage 的存在。
# 其余全部与 H0 逐字段一致（equivalence_lock 由 preflight 强制）。
# ==========================================================================
schema_version: "1.0"
arm_id: H1
role: "external-lesion-pretrained hrdecoder arm"
status: locked-intent

structure:
  family: hrdecoder
  paired_group: hrdecoder
  definition_ref: "docs/ASSET_AND_INTERFACE_AUDIT.md 第4节"
  training_entry: train.py            # 统一训练入口（--stage external_pretrain|ddr_finetune）
  reference_root: REQUIRED            # 旧仓库只读根目录（HRNet/FCNHead adapter 来源）
  open_all_stages: true
  keep_frozen_b_copy: false

initialization:
  imagenet_weights:
    source: REQUIRED
    file: REQUIRED
    sha256: REQUIRED
  external_pretrain_checkpoint: REQUIRED   # 外部预训练产出的 checkpoint；到位后填 file+sha256

data:
  ddr_root: "D:/HRDecoder/data/DDR_split_613"
  ddr_train_split: train
  ddr_val_split: val
  ddr_test_split: test
  channel_order: [EX, HE, SE, MA]
  input_fov: 2048
  train_crop: 1024
  ddr_normalization:
    mean: [81.205, 50.636, 21.216]
    std: [76.252, 48.798, 21.625]

# ---- 外部预训练段（只存在于 H1/U1） ----
pretrain_stage:
  external_manifest: REQUIRED              # 统一外部病灶 manifest（JSONL），通过 audit 后填路径
  allowed_splits: [train]                  # 预训练池只允许官方 train
  forbidden_splits: [test]
  dev_ratio: 0.1                           # 节点选择用外部 train 派生的 dev（绝不碰官方 val/test）
                                           # 划分 = sha256(seed:sample_id) 的纯函数，可复现                 # manifest 中 official_split=test 的样本一律不得进入
  source_mixing: source_balanced_sampling  # 按数据源均衡采样，不通过严重度分类间接迁移
  updates: 8000
  effective_batch: 8
  micro_batch: REQUIRED
  grad_accum: REQUIRED
  optimizer: adamw
  weight_decay: 1.0e-2
  warmup_ratio: 0.05
  lr_schedule: cosine
  cosine_min_ratio: 0.01
  backbone_lr: 1.0e-4
  decoder_lr: 3.0e-4
  channel_order: [EX, HE, SE, MA]
  valid_mask_handling: per_class_valid_masking   # valid=0 类别整类屏蔽，绝不当阴性
  node_selection: external_train_derived_dev_only  # 只用外部 train 派生的开发集选节点
  overfit_monitor: REQUIRED               # 过拟合检查方案（几百 crop 暴露不等于学到新病灶）
  init_checkpoint_output: REQUIRED        # 预训练产出路径+sha256（训练完成后填写）

ddr_finetune_stage:
  seed: 42
  updates: 12000
  effective_batch: 8
  micro_batch: REQUIRED
  grad_accum: REQUIRED
  eval_progress_points: [0.25, 0.5, 0.75, 1.0]
  optimizer: adamw
  weight_decay: 1.0e-2
  warmup_ratio: 0.05
  lr_schedule: cosine
  cosine_min_ratio: 0.01
  backbone_lr: 5.0e-5
  decoder_lr: 2.0e-4
  augmentation:
    resize_ratio_range: [0.5, 2.0]
    random_crop_cat_max_ratio: 0.75
    flip_ratio: 0.5
    rotate_degrees: [-45, 45]
    photometric: light
  sampling: random_plus_foreground_mixed
  bn_policy:
    backbone_norm_eval: true
    affine_trainable: true
  mixed_precision: true
  gradient_checkpointing: REQUIRED

loss:
  type: binary_per_class
  recipe: ce_dice
  smooth: 1.0e-5
  per_class_valid_masking: true       # trainer.loss 已实现 valid=0 整类屏蔽（缺类绝不当阴性）
  ce_weight: 1.0
  dice_weight: 1.0

metrics:
  protocol: whole_image_accumulated_counts
  threshold: 0.5
  primary: mIoU_lesion4
  reported: [mF1, mPPV, mRecall, mAUPR]

checkpoint_selection:
  allowed_splits: [val]
  test_forbidden: true

test_usage:
  train_on_test: forbidden
  select_checkpoint_on_test: forbidden
  final_single_eval: allowed_only_after_full_lock

equivalence_lock:
  identical_with: H0
  fields:
    - data
    - ddr_finetune_stage
    - loss
    - metrics
    - checkpoint_selection
    - test_usage
    - structure.family
    - structure.paired_group
    - initialization.imagenet_weights

notes: >
  H1 回答"真实病灶预训练是否有用"。额外预训练计算量如实记录，不声称等算力优势；
  选出的外部节点进入 DDR 适配后必须使用与 H0 完全相同的同结构 LR 与日程。
